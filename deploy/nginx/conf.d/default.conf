# =========================================================
# Baqueano Natales - Server blocks
# =========================================================
# Por ahora solo HTTP. TLS se agrega después con Certbot.
# =========================================================

# --- Server principal (API) ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Healthcheck propio de nginx (no pasa al backend)
    location = /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    # API - con rate limiting moderado
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://baqueano_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Auth - rate limiting más estricto (OTP, login)
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://baqueano_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Healthcheck público
    location = /health {
        access_log off;
        proxy_pass http://baqueano_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Docs (solo dev - en prod no existen porque la app no los expone)
    location /docs {
        proxy_pass http://baqueano_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://baqueano_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Raíz - info básica
    location = / {
        proxy_pass http://baqueano_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Todo lo demás: 404
    location / {
        return 404 "Not Found\n";
    }
}
