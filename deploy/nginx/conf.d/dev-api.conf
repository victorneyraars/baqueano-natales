# =========================================================
# dev-api.baqueanonatales.com
# Exponer backend a Facebook OAuth (HTTPS obligatorio en Meta)
# SSL mode Cloudflare: "full" -> self-signed alcanza
# =========================================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name dev-api.baqueanonatales.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev-api.baqueanonatales.com;

    ssl_certificate     /etc/nginx/certs/dev-api.crt;
    ssl_certificate_key /etc/nginx/certs/dev-api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # OAuth callback: rate limit mas estricto (evita abuso)
    location /api/v1/admin/social/facebook/oauth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://baqueano_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # API general
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://baqueano_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Healthcheck publico
    location = /health {
        access_log off;
        proxy_pass http://baqueano_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Docs
    location /docs {
        proxy_pass http://baqueano_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://baqueano_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Raiz: info basica
    location = / {
        proxy_pass http://baqueano_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Resto: 404
    location / {
        return 404 "Not Found
";
    }
}
