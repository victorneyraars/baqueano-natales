# =========================================================
# dev-api.baqueanonatales.com -> redirect 301 a api-dev
# Temporal: 30 dias para no romper builds viejas de Flutter.
# =========================================================

server {
    listen 80;
    listen [::]:80;
    server_name dev-api.baqueanonatales.com;
    return 301 https://api-dev.baqueanonatales.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev-api.baqueanonatales.com;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://api-dev.baqueanonatales.com$request_uri;
}
