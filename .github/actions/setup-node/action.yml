name: 'Setup Node and pnpm'
description: 'Instala Node.js y pnpm con caching. Acciones pinned por SHA (seguridad 2026).'

inputs:
  node-version:
    description: 'Versión de Node.js'
    required: false
    default: '22'
  pnpm-version:
    description: 'Versión de pnpm'
    required: false
    default: '9'

runs:
  using: 'composite'
  steps:
    - name: Instalar pnpm
      # pnpm/action-setup@v4 → SHA pinned (verificado 2026-10-27)
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Instalar Node.js
      # actions/setup-node@v4 → SHA pinned (verificado 2026-10-27)
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Instalar dependencias
      shell: bash
      run: pnpm install --frozen-lockfile
