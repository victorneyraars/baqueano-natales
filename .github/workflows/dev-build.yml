name: Dev Build + Distribución Directa (bundletool)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor a buildear'
        required: true
        default: 'clientDev'
        type: choice
        options:
          - clientDev
          - adminDev
          - both

jobs:
  build-client:
    if: github.event.inputs.flavor == 'clientDev' || github.event.inputs.flavor == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Restore keystore
        working-directory: flutter/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/baqueano-release.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=baqueano-release.jks\n" \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties

      - name: Build AAB (clientDev)
        working-directory: flutter
        run: |
          flutter build appbundle --release --flavor clientDev \
            -t lib/main_client.dart \
            --dart-define-from-file=dart_defines/client_dev.json

      - name: Descargar bundletool (con auth para evitar rate limit)
        run: |
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          ls -lh bundletool.jar

      - name: Restaurar keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Generar APK Universal (bundletool manual)
        id: bundletool
        run: |
          echo '${{ secrets.ANDROID_STORE_PASSWORD }}' > /tmp/store-pass.txt
          echo '${{ secrets.ANDROID_KEY_PASSWORD }}' > /tmp/key-pass.txt
          java -jar bundletool.jar build-apks \
            --bundle=flutter/build/app/outputs/bundle/clientDevRelease/app-clientDev-release.aab \
            --output=app-clientDev-release.apks \
            --ks=release.keystore \
            --ks-pass=file:/tmp/store-pass.txt \
            --ks-key-alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            --key-pass=file:/tmp/key-pass.txt \
            --mode=universal
          mkdir -p flutter/build/app/outputs/flutter-apk
          unzip -p app-clientDev-release.apks universal.apk > flutter/build/app/outputs/flutter-apk/app-clientDev-release.apk
          echo "apk-path=flutter/build/app/outputs/flutter-apk/app-clientDev-release.apk" >> $GITHUB_OUTPUT

      - name: Generar Checksum SHA-256 (clientDev)
        working-directory: flutter
        run: |
          APK_PATH="${{ steps.bundletool.outputs.apk-path }}"
          sha256sum "$APK_PATH" | awk '{print $1}' > "${APK_PATH}.sha256"
          echo "SHA-256: $(cat ${APK_PATH}.sha256)"

      - name: Copiar APK y Checksum a servidor (clientDev)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "${{ steps.bundletool.outputs.apk-path }},${{ steps.bundletool.outputs.apk-path }}.sha256"
          target: "/home/deploy/baqueano-natales/deploy/apks/"

      - name: Renombrar APK (clientDev)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/deploy/baqueano-natales/deploy/apks/
            mkdir -p archive
            VERSION=$(grep '^version:' /home/deploy/baqueano-natales/flutter/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1 | tr -d '\r')
            COMMIT_MSG=$(git -C /home/deploy/baqueano-natales log -1 --pretty=%B | head -n 1 | tr -d '\r')
            mv app-clientDev-release.apk app-clientdev.apk 2>/dev/null || true
            
            # Forzar la regeneración del sha256 para que coincida con el APK final
            sha256sum app-clientdev.apk | awk '{print $1}' > app-clientdev.apk.sha256
            
            cp app-clientdev.apk archive/app-clientdev-v${VERSION}.apk || true
            cp app-clientdev.apk.sha256 archive/app-clientdev-v${VERSION}.apk.sha256 || true
            
            SHA=$(cat app-clientdev.apk.sha256 | awk '{print $1}')
            cat > version.json <<EOF
            {
              "latest_version": "$VERSION",
              "url": "https://api-dev.baqueanonatales.com/apks/app-clientdev.apk",
              "sha256": "$SHA",
              "changelog": "$COMMIT_MSG"
            }
            EOF

  build-admin:
    if: github.event.inputs.flavor == 'adminDev' || github.event.inputs.flavor == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Restore keystore
        working-directory: flutter/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/baqueano-release.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=baqueano-release.jks\n" \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties

      - name: Build AAB (adminDev)
        working-directory: flutter
        run: |
          flutter build appbundle --release --flavor adminDev \
            -t lib/main_admin.dart \
            --dart-define-from-file=dart_defines/admin_dev.json

      - name: Descargar bundletool (con auth para evitar rate limit)
        run: |
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar

      - name: Restaurar keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Generar APK Universal (bundletool manual)
        id: bundletool
        run: |
          echo '${{ secrets.ANDROID_STORE_PASSWORD }}' > /tmp/store-pass.txt
          echo '${{ secrets.ANDROID_KEY_PASSWORD }}' > /tmp/key-pass.txt
          java -jar bundletool.jar build-apks \
            --bundle=flutter/build/app/outputs/bundle/adminDevRelease/app-adminDev-release.aab \
            --output=app-adminDev-release.apks \
            --ks=release.keystore \
            --ks-pass=file:/tmp/store-pass.txt \
            --ks-key-alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            --key-pass=file:/tmp/key-pass.txt \
            --mode=universal
          mkdir -p flutter/build/app/outputs/flutter-apk
          unzip -p app-adminDev-release.apks universal.apk > flutter/build/app/outputs/flutter-apk/app-adminDev-release.apk
          echo "apk-path=flutter/build/app/outputs/flutter-apk/app-adminDev-release.apk" >> $GITHUB_OUTPUT

      - name: Generar Checksum SHA-256 (adminDev)
        working-directory: flutter
        run: |
          APK_PATH="${{ steps.bundletool.outputs.apk-path }}"
          sha256sum "$APK_PATH" | awk '{print $1}' > "${APK_PATH}.sha256"
          echo "SHA-256: $(cat ${APK_PATH}.sha256)"

      - name: Copiar APK y Checksum a servidor (adminDev)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "${{ steps.bundletool.outputs.apk-path }},${{ steps.bundletool.outputs.apk-path }}.sha256"
          target: "/home/deploy/baqueano-natales/deploy/apks/"

      - name: Renombrar APK (adminDev)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/deploy/baqueano-natales/deploy/apks/
            mkdir -p archive
            VERSION=$(grep '^version:' /home/deploy/baqueano-natales/flutter/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1 | tr -d '\r')
            mv app-adminDev-release.apk app-admindev.apk 2>/dev/null || true
            
            # Forzar la regeneración del sha256
            sha256sum app-admindev.apk | awk '{print $1}' > app-admindev.apk.sha256
            
            cp app-admindev.apk archive/app-admindev-v${VERSION}.apk || true
            cp app-admindev.apk.sha256 archive/app-admindev-v${VERSION}.apk.sha256 || true