name: Dev Build + Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor a buildear'
        required: true
        default: 'clientDev'
        type: choice
        options:
          - clientDev
          - adminDev
          - both

jobs:
  build-client:
    if: github.event.inputs.flavor == 'clientDev' || github.event.inputs.flavor == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Restore keystore
        working-directory: flutter/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/baqueano-release.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=baqueano-release.jks\n" \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties

      - name: Build clientDev APK
        working-directory: flutter
        run: |
          flutter build apk --release --flavor clientDev \
            -t lib/main_client.dart \
            --dart-define-from-file=dart_defines/client_dev.json

      - name: Debug — listar APKs generados
        working-directory: flutter
        run: find build -name "*.apk" -exec ls -lh {} \;

      - name: Upload to Firebase (clientDev)
        working-directory: flutter
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_CLIENT_DEV }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SA_JSON" > /tmp/firebase-sa.json
          APK=$(find build -name "*clientdev*release*.apk" -o -name "*clientDev*release*.apk" | head -1)
          echo "APK encontrado: $APK"
          if [ -z "$APK" ]; then echo "ERROR: no se encontró APK"; exit 1; fi
          npx -y firebase-tools appdistribution:distribute "$APK" \
            --app "$FIREBASE_APP_ID" \
            --groups dev-testers \
            --project baqueano-natales-prod

  build-admin:
    if: github.event.inputs.flavor == 'adminDev' || github.event.inputs.flavor == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Restore keystore
        working-directory: flutter/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/baqueano-release.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=baqueano-release.jks\n" \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties

      - name: Build adminDev APK
        working-directory: flutter
        run: |
          flutter build apk --release --flavor adminDev \
            -t lib/main_admin.dart \
            --dart-define-from-file=dart_defines/admin_dev.json

      - name: Debug — listar APKs generados
        working-directory: flutter
        run: find build -name "*.apk" -exec ls -lh {} \;

      - name: Upload to Firebase (adminDev)
        working-directory: flutter
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_ADMIN_DEV }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SA_JSON" > /tmp/firebase-sa.json
          APK=$(find build -name "*admindev*release*.apk" -o -name "*adminDev*release*.apk" | head -1)
          echo "APK encontrado: $APK"
          if [ -z "$APK" ]; then echo "ERROR: no se encontró APK"; exit 1; fi
          npx -y firebase-tools appdistribution:distribute "$APK" \
            --app "$FIREBASE_APP_ID" \
            --groups dev-testers \
            --project baqueano-natales-prod
