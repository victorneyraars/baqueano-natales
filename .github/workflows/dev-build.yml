name: Dev Build + Firebase App Distribution
on:
  workflow_dispatch:
    inputs:
      flavor:
        required: true
        default: 'clientDev'
        type: choice
        options: [clientDev, adminDev, both]

jobs:
  build-client:
    if: github.event.inputs.flavor == 'clientDev' || github.event.inputs.flavor == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.6', channel: 'stable', cache: true }
      - run: flutter pub get
        working-directory: flutter
      - name: Restore keystore
        working-directory: flutter/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/baqueano-release.jks
          cat > key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=baqueano-release.jks
          EOF
      - run: flutter build apk --release --flavor clientDev -t lib/main_client.dart --dart-define-from-file=dart_defines/client_dev.json
        working-directory: flutter
      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_CLIENT_DEV }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: flutter/build/app/outputs/flutter-apk/app-clientDev-release.apk
          groups: dev-testers

  build-admin:
    if: github.event.inputs.flavor == 'adminDev' || github.event.inputs.flavor == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.6', channel: 'stable', cache: true }
      - run: flutter pub get
        working-directory: flutter
      - name: Restore keystore
        working-directory: flutter/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/baqueano-release.jks
          cat > key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=baqueano-release.jks
          EOF
      - run: flutter build apk --release --flavor adminDev -t lib/main_admin.dart --dart-define-from-file=dart_defines/admin_dev.json
        working-directory: flutter
      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ADMIN_DEV }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: flutter/build/app/outputs/flutter-apk/app-adminDev-release.apk
          groups: dev-testers
