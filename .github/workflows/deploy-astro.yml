# Workflow reusable para desplegar sitios Astro a Cloudflare Pages.
# Uso desde un repo:
#   jobs:
#     deploy:
#       uses: victorneyraars/baqueano-natales/.github/workflows/deploy-astro.yml@<SHA>
#       with:
#         project-name: mi-proyecto
#       secrets:
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#         CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
name: Deploy Astro to Cloudflare Pages

on:
  workflow_call:
    inputs:
      project-name:
        description: 'Nombre del proyecto en Cloudflare Pages'
        required: true
        type: string
      node-version:
        description: 'Versión de Node.js'
        required: false
        type: string
        default: '22'
      environment:
        description: 'GitHub environment (production/staging)'
        required: false
        type: string
        default: 'production'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-astro-${{ inputs.project-name }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  quality-and-build:
    name: Quality Gate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4 → SHA pinned (verificado 2026-10-27)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js + pnpm
        uses: victorneyraars/baqueano-natales/.github/actions/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}

      - name: Type check
        run: pnpm astro check

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload artifact
        # actions/upload-artifact@v4 → SHA pinned (verificado 2026-10-27)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ inputs.environment }}
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: quality-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Download artifact
        # actions/download-artifact@v4 → SHA pinned (verificado 2026-10-27)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-${{ inputs.environment }}
          path: dist/

      - name: Deploy with wrangler
        # cloudflare/wrangler-action@v3 → SHA pinned (verificado 2026-10-27)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ inputs.project-name }} --branch=${{ inputs.environment }}
