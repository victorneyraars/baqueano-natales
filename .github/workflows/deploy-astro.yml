# Workflow reusable para desplegar sitios Astro a Cloudflare Pages.
# - Autodetecta npm/pnpm por lockfile.
# - Ejecuta astro check solo si el script existe.
# - Deployment a Cloudflare Pages con wrangler-action (SHA pinned).
name: Deploy Astro to Cloudflare Pages

on:
  workflow_call:
    inputs:
      project-name:
        description: 'Nombre del proyecto en Cloudflare Pages'
        required: true
        type: string
      node-version:
        description: 'Versión de Node.js'
        required: false
        type: string
        default: '22'
      environment:
        description: 'GitHub environment (production/preview)'
        required: false
        type: string
        default: 'production'
      cloudflare-branch:
        description: 'Rama a asociar al deploy en Cloudflare Pages'
        required: false
        type: string
        default: 'main'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-astro-${{ inputs.project-name }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  quality-and-build:
    name: Quality Gate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Instalar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}

      - name: Instalar dependencias (npm)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable pnpm
            pnpm install --frozen-lockfile
          else
            npm install
          fi

      - name: Astro Check (si existe script analyze/check)
        run: |
          if node -e "const p=require('./package.json'); process.exit((p.scripts && (p.scripts.check || p.scripts.analyze)) ? 0 : 1)"; then
            npm run analyze --silent 2>/dev/null || npm run check --silent
          else
            echo "Sin script check/analyze, se omite"
          fi

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ inputs.environment }}
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: quality-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-${{ inputs.environment }}
          path: dist/

      - name: Deploy with wrangler
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ inputs.project-name }} --branch=${{ inputs.cloudflare-branch }}
