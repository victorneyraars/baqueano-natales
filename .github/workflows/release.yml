name: Release

# Se dispara SOLO con tags v* (ej: v0.4.0).
# Firma el AAB con el keystore real y lo sube a Google Play (internal track).
#
# Secrets requeridos:
#   ANDROID_KEYSTORE_BASE64   (base64 del .jks)
#   ANDROID_STORE_PASSWORD
#   ANDROID_KEY_PASSWORD
#   ANDROID_KEY_ALIAS
#   GOOGLE_SERVICE_ACCOUNT_JSON (JSON del service account de Play Publisher)
on:
  push:
    tags: ['v*']

jobs:
  release-client:
    name: Release CLIENT a Play Store
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v5

      - name: Setup Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: flutter pub get
        working-directory: flutter

      - name: Restaurar keystore desde secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          ls -lh android/app/upload-keystore.jks
        working-directory: flutter

      - name: Escribir key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
        working-directory: flutter

      - name: Build AAB firmado (client)
        run: |
          flutter build appbundle \
            --flavor clientProd \
            --release \
            -t lib/main_client.dart \
            --dart-define-from-file=dart_defines/client_prod.json
        working-directory: flutter

      - name: Subir a Play Store (internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: cl.baqueanonatales
          releaseFiles: flutter/build/app/outputs/bundle/clientProdRelease/*.aab
          tracks: internal
          status: completed

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties
        working-directory: flutter

  release-admin:
    name: Release ADMIN a Play Store
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: release-client

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v5

      - name: Setup Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: flutter pub get
        working-directory: flutter

      - name: Restaurar keystore desde secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
        working-directory: flutter

      - name: Escribir key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
        working-directory: flutter

      - name: Build AAB firmado (admin)
        run: |
          flutter build appbundle \
            --flavor adminProd \
            --release \
            -t lib/main_admin.dart \
            --dart-define-from-file=dart_defines/admin_prod.json
        working-directory: flutter

      - name: Subir a Play Store (internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: cl.baqueanonatales.admin
          releaseFiles: flutter/build/app/outputs/bundle/adminProdRelease/*.aab
          tracks: internal
          status: completed

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties
        working-directory: flutter