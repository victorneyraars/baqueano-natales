name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode a descargar (vacío = extraer de pubspec.yaml)'
        required: false

jobs:
  release-client:
    name: Release CLIENT a Play Store
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v5

      - name: Setup Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: flutter pub get
        working-directory: flutter

      - name: Restaurar keystore desde secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          ls -lh android/app/upload-keystore.jks
        working-directory: flutter

      - name: Escribir key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
        working-directory: flutter

      - name: Build AAB firmado (client)
        run: |
          flutter build appbundle \
            --flavor clientProd \
            --release \
            -t lib/main_client.dart \
            --dart-define-from-file=dart_defines/client_prod.json
        working-directory: flutter

      - name: Subir a Play Store (internal) - solo push de tag
        if: github.event_name == 'push'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: cl.baqueanonatales
          releaseFiles: flutter/build/app/outputs/bundle/clientProdRelease/*.aab
          tracks: internal
          status: completed

      - name: Instalar dependencias Python
        run: pip install google-api-python-client google-auth google-auth-httplib2

      - name: Configurar credenciales Google
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > /tmp/google-sa.json

      - name: Descargar APK firmado por Google (client)
        run: |
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            VERSION_CODE="${{ github.event.inputs.version_code }}"
          else
            VERSION_CODE=$(grep '^version:' flutter/pubspec.yaml | sed 's/.*+//')
          fi
          echo "versionCode a descargar: $VERSION_CODE"
          python scripts/download_signed_apk.py \
            --json-key /tmp/google-sa.json \
            --package-name cl.baqueanonatales \
            --version-code "$VERSION_CODE" \
            --output /tmp/prod-client.apk

      - name: Copiar APK firmado a servidor (client)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "/tmp/prod-client.apk"
          target: "/home/deploy/baqueano-natales/deploy/apks/prod-client.apk"

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties
        working-directory: flutter

  release-admin:
    name: Release ADMIN a Play Store
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: release-client

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v5

      - name: Setup Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: flutter pub get
        working-directory: flutter

      - name: Restaurar keystore desde secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
        working-directory: flutter

      - name: Escribir key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
        working-directory: flutter

      - name: Build AAB firmado (admin)
        run: |
          flutter build appbundle \
            --flavor adminProd \
            --release \
            -t lib/main_admin.dart \
            --dart-define-from-file=dart_defines/admin_prod.json
        working-directory: flutter

      - name: Subir a Play Store (internal) - solo push de tag
        if: github.event_name == 'push'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: cl.baqueanonatales.admin
          releaseFiles: flutter/build/app/outputs/bundle/adminProdRelease/*.aab
          tracks: internal
          status: completed

      - name: Instalar dependencias Python
        run: pip install google-api-python-client google-auth google-auth-httplib2

      - name: Configurar credenciales Google
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > /tmp/google-sa.json

      - name: Descargar APK firmado por Google (admin)
        run: |
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            VERSION_CODE="${{ github.event.inputs.version_code }}"
          else
            VERSION_CODE=$(grep '^version:' flutter/pubspec.yaml | sed 's/.*+//')
          fi
          echo "versionCode a descargar: $VERSION_CODE"
          python scripts/download_signed_apk.py \
            --json-key /tmp/google-sa.json \
            --package-name cl.baqueanonatales.admin \
            --version-code "$VERSION_CODE" \
            --output /tmp/prod-admin.apk

      - name: Copiar APK firmado a servidor (admin)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "/tmp/prod-admin.apk"
          target: "/home/deploy/baqueano-natales/deploy/apks/prod-admin.apk"

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties
        working-directory: flutter
