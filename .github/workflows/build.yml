name: Build

# Verifica que la app compile sin errores.
# - PRs a main: valida antes de mergear
# - Tags v*: validacion previa al release
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.flavor }} AAB (sin firmar)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: clientProd
            entrypoint: lib/main_client.dart
            defines: dart_defines/client_prod.json
          - flavor: adminProd
            entrypoint: lib/main_admin.dart
            defines: dart_defines/admin_prod.json

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v5

      - name: Setup Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: flutter pub get
        working-directory: flutter

      - name: Build AAB ${{ matrix.flavor }}
        run: |
          flutter build appbundle \
            --flavor ${{ matrix.flavor }} \
            --release \
            -t ${{ matrix.entrypoint }} \
            --dart-define-from-file=${{ matrix.defines }}
        working-directory: flutter

      - name: Verificar AAB generado
        run: |
          AAB=$(find build/app/outputs/bundle -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::No se genero el AAB"
            exit 1
          fi
          ls -lh "$AAB"
        working-directory: flutter

      - name: Subir AAB como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-aab-unsigned
          path: flutter/build/app/outputs/bundle/*/*.aab
          retention-days: 7