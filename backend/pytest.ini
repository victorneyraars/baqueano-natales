[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
cache_dir = /tmp/.pytest_cache
addopts = -ra --strict-markers --tb=short
markers =
    db: test que requiere base de datos Postgres
    integration: test que requiere servicios externos (APIs, red)