name: baqueano_natales
description: "Baqueano Natales - Superapp regional (cliente + admin)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # --- UI ---
  cupertino_icons: ^1.0.8

  # --- Firebase (Auth + FCM) ---
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  google_sign_in: ^7.2.0

  # --- HTTP Client ---
  dio: ^5.7.0

  # --- Storage seguro (JWT) ---
  flutter_secure_storage: ^9.2.2

  # --- Navegación ---
  go_router: ^14.6.2

  # --- State management ---
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true