name: baqueano_natales
description: "Baqueano Natales - Superapp regional (cliente + admin)"
publish_to: 'none'
version: 0.4.0+13
environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # --- UI ---
  cupertino_icons: ^1.0.8

  # --- Firebase (Auth + FCM) ---
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_messaging: ^15.1.5
  google_sign_in: ^6.2.0

  # --- HTTP Client ---
  dio: ^5.7.0

  # --- Storage seguro (JWT) ---
  flutter_secure_storage: ^11.2.0

  # --- Navegación ---
  go_router: ^14.6.2

  # --- State management ---
  flutter_riverpod: ^3.0.0
  flutter_svg: ^2.0.17
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.2
  image_picker: ^1.1.2
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true