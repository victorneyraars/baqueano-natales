# =========================================================
# Baqueano Natales - Override DESARROLLO
# =========================================================
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml logs -f backend-dev
# =========================================================

services:
  # ---------------------------------------------------------
  # Backend FastAPI (desarrollo)
  # ---------------------------------------------------------
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baqueano_backend_dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Hot reload activo en dev
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini
      - ./backend/secrets:/app/secrets:ro
      - media_data_dev:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - baqueano_net

volumes:
  media_data_dev:
    driver: local
