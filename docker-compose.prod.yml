# =========================================================
# Baqueano Natales - Override PRODUCCION
# =========================================================
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml logs -f backend-prod
# =========================================================

services:
  # ---------------------------------------------------------
  # Backend FastAPI (produccion)
  # ---------------------------------------------------------
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baqueano_backend_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Sin hot reload: codigo horneado en la imagen
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini
      - ./backend/secrets:/app/secrets:ro
      - media_data_prod:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - baqueano_net

volumes:
  media_data_prod:
    driver: local
