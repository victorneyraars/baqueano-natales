# =========================================================
# Baqueano Natales - Stack base (dev y prod comparten esto)
# =========================================================
# Uso:
#   Dev:   docker compose up
#   Prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =========================================================

services:
  # ---------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: baqueano_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - baqueano_net
    # No exponer al host. Solo accesible desde la red interna.

  # ---------------------------------------------------------
  # Backend FastAPI
  # ---------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baqueano_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override del host de la DB (dentro de docker es "db", no "localhost")
      POSTGRES_HOST: db
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Hot reload en dev (comentado por default, se activa con override)
      - ./backend/app:/app/app
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - baqueano_net
    # No exponer al host. Nginx lo consume por la red interna.

  # ---------------------------------------------------------
  # Nginx (Reverse Proxy)
  # ---------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: baqueano_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
      # Certificados Let's Encrypt (se montará cuando los tengamos)
      # - ./deploy/certbot/conf:/etc/letsencrypt:ro
      # - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - baqueano_net

# ---------------------------------------------------------
# Volúmenes persistentes
# ---------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  nginx_cache:
    driver: local

# ---------------------------------------------------------
# Red interna del stack
# ---------------------------------------------------------
networks:
  baqueano_net:
    driver: bridge
