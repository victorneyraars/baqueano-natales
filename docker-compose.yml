# =========================================================
# Baqueano Natales - Stack base
# =========================================================
# Este archivo define solo los servicios COMPARTIDOS entre entornos:
#   - db:     PostgreSQL 16 (una instancia, multiples DBs)
#   - nginx:  Reverse proxy (enruta por server_name)
#
# Los backends viven en archivos override por entorno:
#   - docker-compose.prod.yml -> backend-prod (usa .env.prod)
#   - docker-compose.dev.yml  -> backend-dev  (usa .env.dev)
#
# Uso:
#   Solo prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Solo dev:   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   Ambos:      docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.dev.yml up -d
#
# Los scripts en scripts/ encapsulan estas combinaciones.
# =========================================================

services:
  # ---------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: baqueano_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - baqueano_net

  # ---------------------------------------------------------
  # Nginx (Reverse Proxy)
  # ---------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: baqueano_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - baqueano_net

# ---------------------------------------------------------
# Volumenes persistentes
# ---------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  nginx_cache:
    driver: local

# ---------------------------------------------------------
# Red interna del stack
# ---------------------------------------------------------
networks:
  baqueano_net:
    driver: bridge
